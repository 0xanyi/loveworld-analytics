# Dokploy Swarm stack — production
# Managed via Dokploy UI; this file is the source-of-truth copy.
# Differs from staging.yml only in: NODE_ENV, URLs, and replica counts.
version: "3.9"

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER_FILE: /run/secrets/pg_user
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: lwa_production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - pg_user
      - pg_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/pg_user) -d lwa_production"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    image: ghcr.io/0xanyi/loveworld-analytics-api:${DEPLOY_SHA:?DEPLOY_SHA must be set}
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL: redis://redis:6379
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      AUTH_BASE_URL: https://api.app.loveworld-analytics.example
      ALLOWED_ORIGINS: https://app.loveworld-analytics.example
      LWA_KEK_CURRENT: v1
      LWA_KEK_V1_FILE: /run/secrets/connector_kek
      API_PORT: "3001"
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER_FILE: /run/secrets/smtp_user
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      SMTP_FROM: no-reply@loveworld.example
    secrets:
      - database_url
      - auth_secret
      - connector_kek
      - smtp_user
      - smtp_pass
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 3
      update_config: { order: start-first, parallelism: 1, failure_action: rollback }
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 5s
        window: 120s

  ingestion:
    image: ghcr.io/0xanyi/loveworld-analytics-ingestion:${DEPLOY_SHA:?DEPLOY_SHA must be set}
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL: redis://redis:6379
      INGESTION_CONCURRENCY: "4"
      LWA_KEK_CURRENT: v1
      LWA_KEK_V1_FILE: /run/secrets/connector_kek
    secrets:
      - database_url
      - connector_kek
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 5s
        window: 120s

  web:
    image: ghcr.io/0xanyi/loveworld-analytics-web-production:${DEPLOY_SHA:?DEPLOY_SHA must be set}
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_BASE_URL: http://api:3001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 3
      update_config: { order: start-first, parallelism: 1, failure_action: rollback }
      restart_policy:
        condition: on-failure
        max_attempts: 5
        delay: 5s
        window: 120s

secrets:
  pg_user:       { external: true, name: lwa_production_pg_user }
  pg_password:   { external: true, name: lwa_production_pg_password }
  database_url:  { external: true, name: lwa_production_database_url }
  auth_secret:   { external: true, name: lwa_production_auth_secret }
  connector_kek: { external: true, name: lwa_production_connector_kek }
  smtp_user:     { external: true, name: lwa_production_smtp_user }
  smtp_pass:     { external: true, name: lwa_production_smtp_pass }

volumes:
  postgres-data:
  redis-data:
