name: Build Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: services/api/Dockerfile
            image: ghcr.io/0xanyi/loveworld-analytics-api
            build_args: ""
          - name: ingestion
            context: .
            file: services/ingestion/Dockerfile
            image: ghcr.io/0xanyi/loveworld-analytics-ingestion
            build_args: ""
          - name: web-staging
            context: .
            file: apps/web/Dockerfile
            image: ghcr.io/0xanyi/loveworld-analytics-web-staging
            build_args: |
              VITE_API_BASE_URL=https://api.staging.loveworld-analytics.example
          - name: web-production
            context: .
            file: apps/web/Dockerfile
            image: ghcr.io/0xanyi/loveworld-analytics-web-production
            build_args: |
              VITE_API_BASE_URL=https://api.app.loveworld-analytics.example
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          build-args: ${{ matrix.build_args }}
