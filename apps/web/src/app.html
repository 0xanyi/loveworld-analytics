<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Loveworld Analytics — cross-platform rollup reporting for TV channel networks." />
    <!-- Browser chrome colour: matches the paper (light) and ink (dark) surfaces.
         Self-hosted fonts live in app.css (fontsource) — no third-party CDN. -->
    <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)" />
    <title>Loveworld Analytics</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
